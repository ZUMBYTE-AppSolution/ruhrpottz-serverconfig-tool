name: Desktop preview checks and packages
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile desktop and run offline checks
        run: python tools/build.py
      - name: Prepare Linux GUI test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fakeroot x11-utils
      - name: Render and operate the real app (offline)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1680x1100x24' java -cp build/classes:build/test-classes de.zumbyte.pzarchitect.app.UiSmoke build/screenshots
      - name: Locate WiX for Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (-not (Test-Path (Join-Path $wix 'candle.exe')) -or -not (Test-Path (Join-Path $wix 'light.exe'))) {
            throw 'WiX 3.14 compiler/linker not found on Windows runner'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wix
      - name: Build native app and installer
        run: python tools/package.py --installer
      - name: Check bundled Linux launcher window
        if: runner.os == 'Linux'
        run: |
          python -m pip install Pillow
          xvfb-run -a -s '-screen 0 1680x1100x24' python tools/native_smoke.py 'build/native/linux-x64/image/PZ Server Architect/bin/PZ Server Architect' build/screenshots/native-linux.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            build/dist/*
            build/PZ-Server-Architect-0.3.0.jar
            build/test-report.txt
            build/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
