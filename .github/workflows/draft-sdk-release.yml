name: Draft updater SDK release (not desktop app)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and bundle SDK only
        run: |
          python tools/build.py
          python tools/create_sdk.py
      - name: Create a draft development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create sdk-v0.1.0 --target "$COMMIT" --draft --prerelease --title "Updater SDK 0.1.0 (Entwicklungsstand, keine Desktop-App)" --notes-file docs/SDK-RELEASE.md build/PZ-Server-Architect-Updater-0.1.0.jar build/PZ-Server-Architect-Update-SDK-0.1.0.zip build/PZ-Server-Architect-Update-SDK-0.1.0.zip.sha256 build/test-report.txt
