name: Import checksum-verified desktop source
on:
  push:
    branches: [feat/architecture-and-startup-updater]
    paths: ['_import/**']
permissions:
  contents: read
concurrency:
  group: desktop-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'ZUMBYTE-AppSolution/ruhrpottz-serverconfig-tool'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/architecture-and-startup-updater
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source and compile desktop
        run: |
          python _import/import.py
          python tools/build.py
      - name: Commit verified desktop files to development branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = list(json.loads(Path('_import/manifest.json').read_text())['files'])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm --ignore-unmatch tools/create_sdk.py
          git rm -r _import
          git update-index --chmod=+x packaging/START-Linux.sh packaging/START-macOS.command
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add PZ Server Architect 0.3.0 desktop preview' -m 'Import checksum-verified desktop sources, icon, catalogue, profiles, wizard, GitHub-only updates and German documentation. 941 application and 128 updater assertions passed in this job. No public release is published.'
          git push origin HEAD:refs/heads/feat/architecture-and-startup-updater
